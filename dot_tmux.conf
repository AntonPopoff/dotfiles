# Use modern terminal capabilities
set -g default-terminal "tmux-256color"

# Enable true color for any 256color / alacritty / xterm terminal
set -as terminal-features ",*256col*:RGB,alacritty*:RGB"

# Let OSC 52 clipboard work under alacritty
set -as terminal-features ",alacritty*:clipboard"

# Don't delay Esc (vim responsiveness)
set -sg escape-time 10

# Maintain "gapless" window numbers
set -g renumber-windows on

# Enable focus-events passing for programs running inside tmux
set -g focus-events on

# Set the base index for windows and panes to 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Increase tmux's scrollback buffer size
set -g history-limit 131072

# Enable mouse
set -g mouse on

# Reload config
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"

# Use vim motions to switch between panes
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# 'l' was last-window; move it to Tab
bind Tab last-window

# Use Vim-like keys for pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Make all panes equal size
bind e select-layout tiled

# Move windows left and right in the status bar (focus follows)
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Open new windows and panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Native clipboard and vim bindings for copy mode
setw -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy to clipboard, clear highlight, stay in copy mode (keyboard and mouse)
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
